name: Production CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Unit, Integration & E2E Validation
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      VITEST: "true"
      SESSION_SECRET: test_session_secret_for_ci_pipeline_only_32_chars
      COOKIE_SECRET: test_cookie_secret_for_ci_pipeline_only_32_chars

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Typecheck & Linting
        run: npm run lint

      - name: Execute Unit Test Suite
        run: npm run test:unit

      - name: Execute Vertical-Slice Integration Tests
        run: npm run test:integration

      - name: Execute End-to-End User Journeys & Security
        run: npm run test:e2e

      - name: Complete Deterministic CI Regression Suite
        run: npm run test:ci

      - name: Compile Production Build Artifacts
        run: npm run build

      - name: Execute Production Backup & Disaster Recovery Smoke Test
        run: npm run test:backup

