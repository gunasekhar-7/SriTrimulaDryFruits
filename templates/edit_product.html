{% extends "layout.html" %}

{% block content %}
<h2 class="mb-4">✏️ Edit Product</h2>

<div class="card p-4 shadow-sm">
    <div class="alert alert-info border-info">
        <strong>Note:</strong> Update the "Current Stock" box with what is actually on the shelf.
    </div>

    <form method="post">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">Product Name</label>
                <input name="name" class="form-control" value="{{ product['name'] }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Barcode</label>
                <input name="barcode" class="form-control" value="{{ product['barcode'] }}" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label fw-bold text-success">Current Stock</label>
                <input type="number" step="0.001" name="qty" class="form-control border-success border-2 fw-bold" value="{{ current_stock }}" required>
            </div>
            
            <div class="col-md-3">
                <label class="form-label fw-bold">Cost Price</label>
                <input type="number" step="0.01" name="cost" class="form-control" value="{{ product['cost_price'] }}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">MRP</label>
                <input type="number" step="0.01" name="mrp" class="form-control" value="{{ product['mrp'] if product['mrp'] else 0 }}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">Selling Price</label>
                <input type="number" step="0.01" name="sell" class="form-control" value="{{ product['selling_price'] }}" required>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary btn-lg px-5">Update Item</button>
            <a href="/stock" class="btn btn-secondary btn-lg ms-2">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
