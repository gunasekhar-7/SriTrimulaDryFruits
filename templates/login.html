<!DOCTYPE html>
<html>
<head>
    <title>Staff Login</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0B3D25; 
            display: flex; align-items: center; justify-content: center; height: 100vh; 
        }
        .login-card { 
            background: #F9F7F2; padding: 40px; border-radius: 8px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; max-width: 400px; border: 2px solid #D4AF37; 
            text-align: center;
        }
        .brand-title { color: #0B3D25; font-family: 'Merriweather', serif; margin-bottom: 20px; font-size: 1.8rem; }
        .btn-gold { background-color: #D4AF37; border: none; color: #000; font-weight: bold; padding: 10px; }
        .btn-gold:hover { background-color: #c19b2e; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="brand-title">Sri Tirumala<br><span style="font-size: 1rem; color: #666;">DRY FRUITS</span></h2>
        
        <form method="post" action="/login" autocomplete="off">
            
            <input type="text" name="fake_usernameremembered" style="position:absolute; opacity:0; z-index:-1;">
            <input type="password" name="fake_passwordremembered" style="position:absolute; opacity:0; z-index:-1;">

            <div class="mb-3 text-start">
                <label class="form-label fw-bold">Username</label>
                <input type="text" name="username" class="form-control" required 
                       autocomplete="off" 
                       readonly 
                       onfocus="this.removeAttribute('readonly');"
                       style="background-color: white;">
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label fw-bold">Password</label>
                <input type="password" name="password" class="form-control" required 
                       autocomplete="new-password"
                       readonly 
                       onfocus="this.removeAttribute('readonly');"
                       style="background-color: white;">
            </div>
            
            <button type="submit" class="btn btn-gold w-100">Login to Dashboard</button>
        </form>
        
        <div class="mt-3">
            <a href="/" class="text-decoration-none text-muted small">← Back to Home Page</a>
        </div>

        {% if error %}
            <p class="text-danger mt-3 fw-bold">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
