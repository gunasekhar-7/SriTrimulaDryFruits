# ==============================================================================
# Nginx Reverse Proxy Configuration for Sri Tirumala Dry Fruits
# Enforces Single-Hop 301 Permanent Redirect to Canonical Origin:
# https://sritirumaladryfruits.com
# ==============================================================================

# ─── 1. HTTP Server Block (Non-WWW & WWW -> HTTPS Non-WWW in 1 Hop) ───────────
server {
    listen 80;
    listen [::]:80;
    server_name sritirumaladryfruits.com www.sritirumaladryfruits.com;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Strict single-hop permanent 301 redirect preserving original path & query parameters
    location / {
        return 301 https://sritirumaladryfruits.com$request_uri;
    }
}

# ─── 2. HTTPS WWW Server Block (WWW -> Non-WWW in 1 Hop) ──────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sritirumaladryfruits.com;

    # TLS Certificates (Wildcard or multi-domain cert covering www & apex)
    ssl_certificate /etc/letsencrypt/live/sritirumaladryfruits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sritirumaladryfruits.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Strict single-hop permanent 301 redirect to canonical origin
    location / {
        return 301 https://sritirumaladryfruits.com$request_uri;
    }
}

# ─── 3. Canonical HTTPS Non-WWW Server Block (Serves Storefront & POS) ─────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sritirumaladryfruits.com;

    # TLS Certificates
    ssl_certificate /etc/letsencrypt/live/sritirumaladryfruits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sritirumaladryfruits.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Security & HSTS Headers (Preloaded 2 years)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Proxy to Node.js / Express POS App Container
    location / {
        proxy_pass http://pos-app:3000;
        proxy_http_version 1.1;

        # WebSockets & Connection Upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forwarded Client Identity & Scheme Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
